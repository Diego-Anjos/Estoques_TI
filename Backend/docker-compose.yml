services:
  oracle-db:
    image: gvenzl/oracle-xe:21-slim
    container_name: oracle-estoques
    environment:
      - ORACLE_PASSWORD=admin_senha_forte # Senha do admin (sys/system)
      - APP_USER=estoque_user             # Cria seu usuário automaticamente
      - APP_USER_PASSWORD=estoque_senha   # Senha do APP_USER (obrigatório na imagem gvenzl)
    ports:
      - "1521:1521"
    volumes:
      - oracle-data:/opt/oracle/oradata

volumes:
  oracle-data:
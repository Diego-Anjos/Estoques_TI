<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Locais - Sistema Controle de Estoque</title>
    <script src="/theme-boot.js"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="../../../shared/css/responsive.css">
    <link rel="stylesheet" href="../../../shared/css/notify.css">
    <link rel="stylesheet" href="../../../shared/css/confirmModal.css">
    <link rel="stylesheet" href="../../../shared/css/form-controls.css">
</head>
<body>
    <header class="header">
        <div class="header-content">
            <div class="left-section">
                <span class="greeting" id="user-greeting">Olá</span>
            </div>
            <div class="center-section">
                <nav class="breadcrumb" id="breadcrumb">
                    <a href="../../auth/dashboard/paginainicial/index.html" class="breadcrumb-item">Dashboard</a>
                    <span class="breadcrumb-sep">/</span>
                    <span class="breadcrumb-item active">Gestão de Locais</span>
                </nav>
            </div>
            <div class="right-section">
                <button class="theme-toggle" id="theme-toggle" title="Alternar tema">
                    <span class="theme-icon">◐</span>
                </button>
                <button class="logout-btn" id="logout-btn" title="Sair do sistema">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"/>
                        <path d="M12 2v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                </button>
                <div class="user-dropdown dropdown" id="user-dropdown">
                    <button class="user-btn dropdown-btn" id="user-btn">
                        <span class="user-icon">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"/>
                                <circle cx="12" cy="8" r="3" stroke="currentColor" stroke-width="2"/>
                                <path d="M6.168 18.849A6 6 0 0 1 12 16a6 6 0 0 1 5.832 2.849" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                            </svg>
                        </span>
                    </button>
                    <div class="dropdown-content" id="user-dropdown-content">
                        <a href="../../profile/index.html" class="dropdown-item" id="perfil-btn">
                            <span class="item-icon">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <circle cx="12" cy="8" r="5" stroke="currentColor" stroke-width="2"/>
                                    <path d="M20 21a8 8 0 0 0-16 0" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                                </svg>
                            </span>
                            Perfil
                        </a>
                        <a href="#" class="dropdown-item" id="sair-btn">
                            <span class="item-icon">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                    <polyline points="16,17 21,12 16,7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                    <line x1="21" y1="12" x2="9" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                </svg>
                            </span>
                            Sair
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main class="main-content">
        <section id="locais" class="locais-section active">
            <div class="filters-header">
                <h2 class="page-title">Gestão de Locais</h2>
                <div class="header-buttons">
                    <button class="btn-export-local" id="btn-voltar-dashboard" title="Voltar ao dashboard">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M19 12H5M12 19l-7-7 7-7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </button>
                    <button class="btn-add-local" id="btn-adicionar-local" title="Adicionar local">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </button>
                </div>
            </div>

            <div class="main-filters" id="main-filters">
                <div class="filter-row">
                    <div class="filter-group">
                        <label>Nome do Local:</label>
                        <input type="text" class="filter-input-new" placeholder="Digite o nome do local" id="nome-input">
                    </div>
                    <div class="filter-group">
                        <label>Setor:</label>
                        <input type="text" class="filter-input-new" placeholder="Digite o setor" id="setor-input">
                    </div>
                    <div class="filter-actions">
                        <button class="btn-loading" id="btn-buscar" type="button">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <circle cx="11" cy="11" r="8" stroke="currentColor" stroke-width="2"/>
                                <path d="m21 21-4.35-4.35" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                            Buscar
                        </button>
                        <button class="btn-clear" id="btn-limpar" type="button">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M18 6L6 18M6 6l12 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                            Limpar
                        </button>
                    </div>
                </div>
                <div class="advanced-filter">
                    <button class="btn-advanced-filter" id="btn-filtro-avancado-locais" type="button" aria-expanded="false">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                        Filtro avançado
                    </button>
                    <div class="advanced-filter-panel" id="filtro-avancado-locais-panel" hidden>
                        <div class="filter-group">
                            <label for="status-local-filtro">Status:</label>
                            <select class="filter-select-new" id="status-local-filtro">
                                <option value="ativos" selected>Apenas Ativos</option>
                                <option value="inativos">Apenas Inativos</option>
                                <option value="todos">Todos</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>

            <div class="content-area">
                <div class="locais-table-container">
                    <table class="locais-table" id="locais-table">
                        <thead>
                            <tr>
                                <th class="id-col">ID</th>
                                <th class="name-col">Nome do Local</th>
                                <th class="setor-col">Setor</th>
                                <th class="description-col">Descrição</th>
                                <th class="status-col">Status</th>
                                <th class="actions-col">Ações</th>
                            </tr>
                        </thead>
                        <tbody id="locais-tbody">
                            <!-- Locais serão inseridos aqui via JavaScript -->
                        </tbody>
                    </table>
                </div>
            </div>
        </section>
    </main>

    <!-- Modal para adicionar/editar local -->
    <div id="modal-local" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-local-title">Adicionar Local</h3>
                <span class="close" id="close-local">&times;</span>
            </div>
            <form id="local-form" class="local-form">
                <input type="hidden" id="local-id" name="local-id" value="">
                <div class="form-group">
                    <label for="nome-local">Nome do Local:</label>
                    <input type="text" id="nome-local" name="nome-local" required minlength="2" maxlength="120" placeholder="Ex: Prédio A">
                </div>
                <div class="form-group">
                    <label for="setor-local">Setor:</label>
                    <input type="text" id="setor-local" name="setor-local" maxlength="80" placeholder="Ex: TI, RH">
                </div>
                <div class="form-group">
                    <label for="descricao-local">Descrição:</label>
                    <textarea id="descricao-local" name="descricao-local" rows="3" maxlength="300" placeholder="Descreva o local"></textarea>
                </div>
                <div class="form-group">
                    <label for="status-local">Status:</label>
                    <select id="status-local" name="status-local">
                        <option value="Ativo">Ativo</option>
                        <option value="Inativo">Inativo</option>
                    </select>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn-secondary" id="btn-cancelar-local">Cancelar</button>
                    <button type="submit" class="btn-primary">Salvar</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>

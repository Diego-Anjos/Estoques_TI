<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Itens - Sistema Controle de Estoque</title>
    <script src="/theme-boot.js"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="../../../shared/css/responsive.css">
    <link rel="stylesheet" href="../../../shared/css/notify.css">
    <link rel="stylesheet" href="../../../shared/css/confirmModal.css">
    <link rel="stylesheet" href="../../../shared/css/form-controls.css">
</head>
<body>
    <header class="header">
        <div class="header-content">
            <div class="left-section">
                <span class="greeting" id="user-greeting">Olá</span>
            </div>
            <div class="center-section">
                <nav class="breadcrumb" id="breadcrumb">
                    <a href="../../auth/dashboard/paginainicial/index.html" class="breadcrumb-item">Dashboard</a>
                    <span class="breadcrumb-sep">/</span>
                    <span class="breadcrumb-item active">Cadastro de Itens</span>
                </nav>
            </div>
            <div class="right-section">
                <button class="theme-toggle" id="theme-toggle" title="Alternar tema">
                    <span class="theme-icon">◐</span>
                </button>
                <button class="logout-btn" id="logout-btn" title="Sair do sistema">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"/>
                        <path d="M12 2v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                </button>
                <div class="user-dropdown dropdown" id="user-dropdown">
                    <button class="user-btn dropdown-btn" id="user-btn">
                        <span class="user-icon">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"/>
                                <circle cx="12" cy="8" r="3" stroke="currentColor" stroke-width="2"/>
                                <path d="M6.168 18.849A6 6 0 0 1 12 16a6 6 0 0 1 5.832 2.849" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                            </svg>
                        </span>
                    </button>
                    <div class="dropdown-content" id="user-dropdown-content">
                        <a href="../../profile/index.html" class="dropdown-item" id="perfil-btn">
                            <span class="item-icon">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <circle cx="12" cy="8" r="5" stroke="currentColor" stroke-width="2"/>
                                    <path d="M20 21a8 8 0 0 0-16 0" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                                </svg>
                            </span>
                            Perfil
                        </a>
                        <a href="#" class="dropdown-item" id="sair-btn">
                            <span class="item-icon">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                    <polyline points="16,17 21,12 16,7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                    <line x1="21" y1="12" x2="9" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                </svg>
                            </span>
                            Sair
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main class="main-content">
        <div class="filters-header">
            <h2 class="page-title">Cadastro de Itens</h2>
            <div class="header-buttons">
                <button class="btn-export-item" id="btn-voltar-dashboard-itens" title="Voltar ao Dashboard">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M19 12H5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M12 19l-7-7 7-7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
                <button class="btn-add-item" id="btn-adicionar-item" title="Adicionar item">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
            </div>
        </div>

        <div class="main-filters" id="main-filters-itens">
            <div class="filter-row">
                <div class="filter-group">
                    <label>Nome do Item:</label>
                    <input type="text" class="filter-input-new" placeholder="Digite o nome do item" id="nome-item-input">
                </div>
                <div class="filter-group">
                    <label>Tipo:</label>
                    <select class="filter-select-new" id="tipo-item-select">
                        <option value="">Todos os tipos</option>
                    </select>
                </div>
                <div class="filter-actions">
                    <button class="btn-loading" id="btn-buscar-itens" type="button">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <circle cx="11" cy="11" r="8" stroke="currentColor" stroke-width="2"/>
                            <path d="m21 21-4.35-4.35" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                        Buscar
                    </button>
                    <button class="btn-clear" id="btn-limpar-itens" type="button">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M18 6L6 18M6 6l12 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                        Limpar
                    </button>
                </div>
            </div>
            <div class="advanced-filter">
                <button class="btn-advanced-filter" id="btn-filtro-avancado-itens" type="button" aria-expanded="false">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    Filtro avançado
                </button>
                <div class="advanced-filter-panel" id="filtro-avancado-itens-panel" hidden>
                    <div class="filter-group">
                        <label for="status-item-filtro">Status:</label>
                        <select class="filter-select-new" id="status-item-filtro">
                            <option value="ativos" selected>Apenas Ativos</option>
                            <option value="inativos">Apenas Inativos</option>
                            <option value="todos">Todos</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>

        <div class="content-area">
            <div class="itens-table-container">
                <table class="itens-table" id="itens-table">
                    <thead>
                        <tr>
                            <th class="id-col">ID</th>
                            <th class="name-col">Nome do Item</th>
                            <th class="type-col">Tipo</th>
                            <th class="description-col">Descrição</th>
                            <th class="quantity-col">Quantidade</th>
                            <th class="unit-col">Unidade</th>
                            <th class="location-col">Local</th>
                            <th class="status-col">Status</th>
                            <th class="actions-col">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="itens-tbody">
                        <!-- Itens serão inseridos aqui via JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <div id="modal-item" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-item-title">Adicionar Item</h3>
                <span class="close" id="close-item">&times;</span>
            </div>
            <form id="item-form" class="item-form">
                <input type="hidden" id="item-id" name="item-id" value="">
                <div class="form-group">
                    <label for="nome-item">Nome do Item:</label>
                    <input type="text" id="nome-item" name="nome-item" required minlength="2" maxlength="200" placeholder="Ex: Mouse Óptico">
                </div>
                <div class="form-group">
                    <label for="tipo-item">Tipo:</label>
                    <select id="tipo-item" name="tipo-item" required>
                        <option value="">Selecione um tipo</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="descricao-item">Descrição:</label>
                    <textarea id="descricao-item" name="descricao-item" rows="3" maxlength="400" placeholder="Ex: Monitor LED 24&quot;, Teclado USB, Cabo de Rede Cat6"></textarea>
                </div>
                <div class="form-group">
                    <label for="quantidade-item">Quantidade:</label>
                    <input type="number" id="quantidade-item" name="quantidade-item" min="0" required placeholder="0" value="0">
                </div>
                <div class="form-group">
                    <label for="unidade-item">Unidade:</label>
                    <select id="unidade-item" name="unidade-item" required>
                        <option value="">Selecione uma unidade</option>
                        <option value="UN">Unidade</option>
                        <option value="PC">Peça</option>
                        <option value="KG">Quilograma</option>
                        <option value="LT">Litro</option>
                        <option value="MT">Metro</option>
                        <option value="M2">Metro Quadrado</option>
                        <option value="M3">Metro Cúbico</option>
                        <option value="CX">Caixa</option>
                        <option value="PCT">Pacote</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="local-item">Local:</label>
                    <select id="local-item" name="local-item" required>
                        <option value="">Selecione um local</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="status-item">Status:</label>
                    <select id="status-item" name="status-item" required>
                        <option value="Ativo">Ativo</option>
                        <option value="Inativo">Inativo</option>
                    </select>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn-secondary" id="btn-cancelar-item">Cancelar</button>
                    <button type="submit" class="btn-primary">Salvar</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tipos de Item - Sistema Controle de Estoque</title>
    <script src="../../../shared/js/theme-boot.js"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="../../../shared/css/responsive.css">
    <link rel="stylesheet" href="../../../shared/css/notify.css">
    <link rel="stylesheet" href="../../../shared/css/confirmModal.css">
    <link rel="stylesheet" href="../../../shared/css/form-controls.css">
</head>
<body>
    <header class="header">
        <div class="header-content">
            <div class="left-section">
                <span class="greeting" id="user-greeting">Olá</span>
            </div>
            <div class="center-section">
                <nav class="breadcrumb" id="breadcrumb">
                    <a href="../../auth/dashboard/paginainicial/index.html" class="breadcrumb-item">Dashboard</a>
                    <span class="breadcrumb-sep">/</span>
                    <span class="breadcrumb-item active">Tipos de Item</span>
                </nav>
            </div>
            <div class="right-section">
                <button class="theme-toggle" id="theme-toggle" title="Alternar tema">
                    <span class="theme-icon">◐</span>
                </button>
                <button class="logout-btn" id="logout-btn" title="Sair do sistema">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"/>
                        <path d="M12 2v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                </button>
                <div class="user-dropdown dropdown" id="user-dropdown">
                    <button class="user-btn dropdown-btn" id="user-btn">
                        <span class="user-icon">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"/>
                                <circle cx="12" cy="8" r="3" stroke="currentColor" stroke-width="2"/>
                                <path d="M6.168 18.849A6 6 0 0 1 12 16a6 6 0 0 1 5.832 2.849" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                            </svg>
                        </span>
                    </button>
                    <div class="dropdown-content" id="user-dropdown-content">
                        <a href="../../profile/index.html" class="dropdown-item" id="perfil-btn">
                            <span class="item-icon">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <circle cx="12" cy="8" r="5" stroke="currentColor" stroke-width="2"/>
                                    <path d="M20 21a8 8 0 0 0-16 0" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                                </svg>
                            </span>
                            Perfil
                        </a>
                        <a href="#" class="dropdown-item" id="sair-btn">
                            <span class="item-icon">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                    <polyline points="16,17 21,12 16,7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                    <line x1="21" y1="12" x2="9" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                </svg>
                            </span>
                            Sair
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main class="main-content">
        <div class="filters-header">
            <h2 class="page-title">Gestão de Tipos de Item</h2>
            <div class="header-buttons">
                <button class="btn-export-tipo" id="btn-voltar-dashboard-tipos" title="Voltar ao Dashboard">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M19 12H5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M12 19l-7-7 7-7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
                <button class="btn-add-tipo" id="btn-adicionar-tipo" title="Adicionar tipo">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
            </div>
        </div>

        <div class="main-filters" id="main-filters-tipos">
            <div class="filter-row">
                <div class="filter-group">
                    <label>Nome do Tipo:</label>
                    <input type="text" class="filter-input-new" placeholder="Ex: Hardware, Periféricos" id="nome-tipo-input">
                </div>
                <div class="filter-group">
                    <label>Categoria:</label>
                    <select class="filter-select-new" id="categoria-tipo-select">
                        <option value="">Todas as categorias</option>
                    </select>
                </div>
                <div class="filter-actions">
                    <button class="btn-loading" id="btn-buscar-tipos" type="button">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <circle cx="11" cy="11" r="8" stroke="currentColor" stroke-width="2"/>
                            <path d="m21 21-4.35-4.35" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                        Buscar
                    </button>
                    <button class="btn-clear" id="btn-limpar-tipos" type="button">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M18 6L6 18M6 6l12 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                        Limpar
                    </button>
                </div>
            </div>
            <div class="advanced-filter">
                <button class="btn-advanced-filter" id="btn-filtro-avancado-tipos" type="button" aria-expanded="false">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    Filtro avançado
                </button>
                <div class="advanced-filter-panel" id="filtro-avancado-tipos-panel" hidden>
                    <div class="filter-group">
                        <label for="status-tipo-filtro">Status:</label>
                        <select class="filter-select-new" id="status-tipo-filtro">
                            <option value="ativos" selected>Apenas Ativos</option>
                            <option value="inativos">Apenas Inativos</option>
                            <option value="todos">Todos</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>

        <div class="content-area">
            <div class="tipos-table-container">
                <table class="tipos-table" id="tipos-table">
                    <thead>
                        <tr>
                            <th class="id-col">ID</th>
                            <th class="name-col">Nome do Tipo</th>
                            <th class="description-col">Descrição</th>
                            <th class="status-col">Status</th>
                            <th class="date-creation-col">Data Criação</th>
                            <th class="created-by-col">Criado Por</th>
                            <th class="actions-col">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tipos-tbody">
                        <!-- Tipos serão inseridos aqui via JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <div id="modal-tipo" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-tipo-title">Adicionar Tipo de Item</h3>
                <span class="close" id="close-tipo">&times;</span>
            </div>
            <form id="tipo-form" class="tipo-form">
                <input type="hidden" id="tipo-id" name="tipo-id" value="">
                <div class="form-group">
                    <label for="nome-tipo">Nome do Tipo:</label>
                    <input type="text" id="nome-tipo" name="nome-tipo" required minlength="2" maxlength="120" placeholder="Ex: Hardware">
                </div>
                <div class="form-group">
                    <label for="descricao-tipo">Descrição:</label>
                    <textarea id="descricao-tipo" name="descricao-tipo" rows="3" maxlength="400" placeholder="Ex: Equipamentos e componentes de hardware"></textarea>
                </div>
                <div class="form-group">
                    <label for="status-tipo">Status:</label>
                    <select id="status-tipo" name="status-tipo" required>
                        <option value="Ativo">Ativo</option>
                        <option value="Inativo">Inativo</option>
                    </select>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn-secondary" id="btn-cancelar-tipo">Cancelar</button>
                    <button type="submit" class="btn-primary">Salvar</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>

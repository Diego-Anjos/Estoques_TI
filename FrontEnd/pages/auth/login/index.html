<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela de Login</title>
    <script src="/theme-boot.js"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="../../../shared/css/notify.css">
    <link rel="stylesheet" href="../../../shared/css/form-controls.css">
</head>
<body>
    <div class="container">

    <!-- LADO ESQUERDO -->
    <div class="left">
        <div class="logo">
            <div class="logo-icon"></div>
            <span> Sistema Controle de Estoque </span>
        </div>
        <div class="illustration">
            <img src="tela inicial.png" alt="Tela Inicial" class="initial-screen-image">
        </div>
    </div>

    <!-- LADO DIREITO -->
    <div class="right">
        <div class="form-box">
            <h1>Bem-vindo!</h1>
            <p>Entre na sua conta</p>

            <form id="form-login">
                <label for="email-login">Email</label>
                <input type="email" id="email-login" name="email" placeholder="Digite seu email" required>

                <label for="senha-login">Senha</label>
                <input type="password" id="senha-login" name="senha" placeholder="Digite sua senha" required minlength="6">

                <button type="submit" id="btn-entrar">Entrar</button>
            </form>

            <div class="forgot-password">
                <a href="#">Esqueceu sua senha?</a>
            </div>

            <div class="signup-link">
                Não tem uma conta? <a href="../register/index.html">Cadastrar</a>
            </div>
        </div>
    </div>

    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
